extends: default

rules:
  document-start:
    present: false
    # A test layout holding two documents in one file, on purpose.
    ignore: |
      tests/errors/multi-document-manifest/
  braces:
    forbid: non-empty
  brackets:
    forbid: non-empty
  line-length: disable
  # GitHub Actions workflows start with a bare `on:` key.
  truthy:
    check-keys: false
