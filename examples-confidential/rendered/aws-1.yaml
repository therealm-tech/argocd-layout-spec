---
# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform.external-secrets.aws-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: aws-1
    namespace: external-secrets
  sources:
    - repoURL: ghcr.io/external-secrets/charts
      chart: external-secrets
      targetRevision: "2.11.0"
      helm:
        releaseName: external-secrets
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples-confidential/base
      kustomize:
        components:
          - https://github.com/therealm-tech/argocd-layout-spec//examples/catalog/apps/external-secrets/manifests?ref=v0.1.0
          - ../clusters/aws-1/overrides/external-secrets/manifests
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      jqPathExpressions:
      - .webhooks[].clientConfig.caBundle
      kind: ValidatingWebhookConfiguration
    - group: apiextensions.k8s.io
      jqPathExpressions:
      - .spec.conversion.webhook.clientConfig.caBundle
      kind: CustomResourceDefinition

---
# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform.layout.aws-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: aws-1
    namespace: argocd
  sources:
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples-confidential/base
      kustomize:
        components:
          - https://github.com/therealm-tech/argocd-layout-spec//examples/catalog/apps/layout/manifests?ref=v0.1.0
        patches:
          - target:
              group: argoproj.io
              kind: ApplicationSet
              name: layout
              namespace: argocd
            patch: |-
              - op: replace
                path: /spec/template/spec/source/helm/valuesObject/layout/path
                value: "examples-confidential"
              - op: replace
                path: /spec/template/spec/source/helm/valuesObject/layout/repoURL
                value: "https://github.com/therealm-tech/argocd-layout-spec"
              - op: replace
                path: /spec/template/spec/source/helm/valuesObject/layout/targetRevision
                value: "HEAD"
              - op: replace
                path: /spec/template/spec/source/path
                value: "examples-confidential"
              - op: replace
                path: /spec/template/spec/source/repoURL
                value: "https://github.com/therealm-tech/argocd-layout-spec"
              - op: replace
                path: /spec/template/spec/source/targetRevision
                value: "HEAD"
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
