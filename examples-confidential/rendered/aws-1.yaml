---
# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acme.grafana.aws-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: aws-1
    namespace: acme-grafana
  sources:
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: grafana
      targetRevision: "13.2.7"
      helm:
        releaseName: acme-grafana
        valueFiles:
          - $catalog/examples/catalog/apps/grafana/values/chart.yaml
          - $layout/examples-confidential/envs/acme/instances/grafana/values/chart.yaml
        parameters:
          - name: global.imageRegistry
            value: "docker.io"
            forceString: true
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      ref: layout
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "v0.1.0"
      ref: catalog
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples-confidential/base
      kustomize:
        components:
          - https://github.com/therealm-tech/argocd-layout-spec//examples/catalog/apps/grafana/manifests?ref=v0.1.0
        patches:
          - target:
              group: external-secrets.io
              kind: ExternalSecret
              name: grafana-admin
              namespace: default
            patch: |-
              - op: replace
                path: /spec/secretStoreRef/name
                value: "aws-secrets-manager"
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true

