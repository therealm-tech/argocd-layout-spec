# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-layout-lab-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: lab-1
    namespace: layout
  sources:
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples/catalog/apps/layout/manifests
      kustomize:
        patches:
          - target:
              group: argoproj.io
              kind: ApplicationSet
              name: layout
              namespace: argocd
            patch: |-
              - op: add
                path: /spec/template/spec/source/helm/valuesObject/layout/path
                value: "examples"
              - op: add
                path: /spec/template/spec/source/helm/valuesObject/layout/repoURL
                value: "https://github.com/therealm-tech/argocd-layout-spec"
              - op: add
                path: /spec/template/spec/source/helm/valuesObject/layout/targetRevision
                value: "HEAD"
              - op: add
                path: /spec/template/spec/source/path
                value: "examples"
              - op: add
                path: /spec/template/spec/source/repoURL
                value: "https://github.com/therealm-tech/argocd-layout-spec"
              - op: add
                path: /spec/template/spec/source/targetRevision
                value: "HEAD"
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true

