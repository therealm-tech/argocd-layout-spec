apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-ceph-hdd-lab-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: lab-1
    namespace: ceph-hdd
  sources:
    - repoURL: https://charts.rook.io/release
      chart: rook-ceph-cluster
      targetRevision: "v1.20.8"
      helm:
        releaseName: ceph-hdd
        valueFiles:
          - $layout/examples/catalog/apps/rook-ceph-cluster/values/chart.yaml
          - $layout/examples/envs/prod/instances/ceph-hdd/values/chart.yaml
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      ref: layout
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples/catalog/apps/rook-ceph-cluster/manifests
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true

