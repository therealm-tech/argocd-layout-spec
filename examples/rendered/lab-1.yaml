# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-grafana-lab-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: lab-1
    namespace: grafana
  sources:
    - repoURL: ghcr.io/grafana/helm-charts
      chart: grafana
      targetRevision: "10.5.15"
      helm:
        releaseName: grafana
        valueFiles:
          - $layout/examples/catalog/apps/grafana/values/chart.yaml
          - $layout/examples/envs/prod/instances/grafana/values/chart.yaml
        parameters:
          - name: global.imageRegistry
            value: "mirror.gcr.io"
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      ref: layout
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples/catalog/apps/grafana/manifests
      kustomize:
        patches:
          - target:
              group: external-secrets.io
              kind: ExternalSecret
              name: grafana-admin
            patch: |-
              - op: add
                path: /spec/secretStoreRef/name
                value: "vault-lab"
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true

