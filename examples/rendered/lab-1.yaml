# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform.cert-manager.lab-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: lab-1
    namespace: cert-manager
  sources:
    - repoURL: quay.io/jetstack/charts
      chart: cert-manager
      targetRevision: "v1.21.2"
      helm:
        releaseName: cert-manager
        valueFiles:
          - $layout/examples/catalog/apps/cert-manager/values/chart.yaml
        parameters:
          - name: imageRegistry
            value: "quay.io"
            forceString: true
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      ref: layout
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples/base
      kustomize:
        components:
          - ../catalog/apps/cert-manager/manifests
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true

---
# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform.external-secrets.lab-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: lab-1
    namespace: external-secrets
  sources:
    - repoURL: ghcr.io/external-secrets/charts
      chart: external-secrets
      targetRevision: "2.11.0"
      helm:
        releaseName: external-secrets
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples/base
      kustomize:
        components:
          - ../catalog/apps/external-secrets/manifests
        patches:
          - target:
              group: external-secrets.io
              kind: ClusterSecretStore
              name: vault
              namespace: default
            patch: |-
              - op: replace
                path: /spec/provider/vault/server
                value: "https://vault.lab-1.example.com"
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      jqPathExpressions:
      - .webhooks[].clientConfig.caBundle
      kind: ValidatingWebhookConfiguration

---
# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform.layout.lab-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: lab-1
    namespace: argocd
  sources:
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples/base
      kustomize:
        components:
          - ../catalog/apps/layout/manifests
        patches:
          - target:
              group: argoproj.io
              kind: ApplicationSet
              name: layout
              namespace: argocd
            patch: |-
              - op: replace
                path: /spec/template/spec/source/helm/valuesObject/layout/path
                value: "examples"
              - op: replace
                path: /spec/template/spec/source/helm/valuesObject/layout/repoURL
                value: "https://github.com/therealm-tech/argocd-layout-spec"
              - op: replace
                path: /spec/template/spec/source/helm/valuesObject/layout/targetRevision
                value: "HEAD"
              - op: replace
                path: /spec/template/spec/source/path
                value: "examples"
              - op: replace
                path: /spec/template/spec/source/repoURL
                value: "https://github.com/therealm-tech/argocd-layout-spec"
              - op: replace
                path: /spec/template/spec/source/targetRevision
                value: "HEAD"
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true

