# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod.grafana.lab-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: lab-1
    namespace: prod-grafana
  sources:
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: grafana
      targetRevision: "13.2.7"
      helm:
        releaseName: prod-grafana
        valueFiles:
          - $layout/examples/catalog/apps/grafana/values/chart.yaml
          - $layout/examples/envs/prod/instances/grafana/values/chart.yaml
        parameters:
          - name: global.imageRegistry
            value: "docker-cache.example.com"
            forceString: true
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      ref: layout
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples/base
      kustomize:
        components:
          - ../catalog/apps/grafana/manifests
        patches:
          - target:
              group: external-secrets.io
              kind: ExternalSecret
              name: grafana-admin
              namespace: default
            patch: |-
              - op: replace
                path: /spec/secretStoreRef/name
                value: "vault"
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true

