---
# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform.cert-manager.airgap-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: airgap-1
    namespace: platform-cert-manager
  sources:
    - repoURL: harbor.airgap.internal/quay.io/jetstack/charts
      chart: cert-manager
      targetRevision: "v1.21.2"
      helm:
        releaseName: platform-cert-manager
        valueFiles:
          - $layout/examples/catalog/apps/cert-manager/values/chart.yaml
        parameters:
          - name: image.registry
            value: "harbor.airgap.internal/quay.io"
            forceString: true
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      ref: layout
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples/base
      kustomize:
        components:
          - ../catalog/apps/cert-manager/manifests
          - ../clusters/airgap-1/overrides/cert-manager/manifests
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true

