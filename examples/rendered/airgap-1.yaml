---
# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform.cert-manager.airgap-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: airgap-1
    namespace: cert-manager
  sources:
    - repoURL: harbor.airgap.internal/quay.io/jetstack/charts
      chart: cert-manager
      targetRevision: "v1.21.2"
      helm:
        releaseName: cert-manager
        valueFiles:
          - $layout/examples/catalog/apps/cert-manager/values/chart.yaml
        parameters:
          - name: imageRegistry
            value: "harbor.airgap.internal/quay.io"
            forceString: true
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      ref: layout
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples/base
      kustomize:
        components:
          - ../catalog/apps/cert-manager/manifests
          - ../clusters/airgap-1/overrides/cert-manager/manifests
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true

---
# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform.external-secrets.airgap-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: airgap-1
    namespace: external-secrets
  sources:
    - repoURL: harbor.airgap.internal/ghcr.io/external-secrets/charts
      chart: external-secrets
      targetRevision: "2.11.0"
      helm:
        releaseName: external-secrets
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples/base
      kustomize:
        components:
          - ../catalog/apps/external-secrets/manifests
        patches:
          - target:
              group: external-secrets.io
              kind: ClusterSecretStore
              name: vault
              namespace: default
            patch: |-
              - op: replace
                path: /spec/provider/vault/server
                value: "https://vault.airgap.internal"
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      jqPathExpressions:
      - .webhooks[].clientConfig.caBundle
      kind: ValidatingWebhookConfiguration
    - group: apiextensions.k8s.io
      jqPathExpressions:
      - .spec.conversion.webhook.clientConfig.caBundle
      kind: CustomResourceDefinition

