---
# Source: layout/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod.grafana.airgap-1
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 0
  destination:
    name: airgap-1
    namespace: prod-grafana
  sources:
    - repoURL: harbor.airgap.internal/ghcr.io/grafana/helm-charts
      chart: grafana
      targetRevision: "10.5.15"
      helm:
        releaseName: prod-grafana
        valueFiles:
          - $layout/examples/catalog/apps/grafana/values/chart.yaml
          - $layout/examples/envs/prod/instances/grafana/values/chart.yaml
          - $layout/examples/envs/prod/clusters/airgap-1/instances/grafana/values/chart.yaml
        parameters:
          - name: global.imageRegistry
            value: "harbor.airgap.internal/docker.io"
            forceString: true
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      ref: layout
    - repoURL: https://github.com/therealm-tech/argocd-layout-spec
      targetRevision: "HEAD"
      path: examples/base
      kustomize:
        components:
          - ../catalog/apps/grafana/manifests
          - ../envs/prod/clusters/airgap-1/instances/grafana/manifests
        patches:
          - target:
              group: external-secrets.io
              kind: ExternalSecret
              name: grafana-admin
            patch: |-
              - op: replace
                path: /spec/secretStoreRef/name
                value: "aws-secrets-manager"
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
