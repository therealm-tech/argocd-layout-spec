{{- $root := . -}}
{{- $cluster := required "cluster is required" .Values.cluster -}}
{{- $repoURL := required "layout.repoURL is required" .Values.layout.repoURL -}}
{{- $revision := required "layout.targetRevision is required" .Values.layout.targetRevision -}}
{{- $catalog := include "layout.catalog" . | fromJson -}}
{{- $io := dict "root" $root "catalog" $catalog -}}

{{- /*
Only the environments placed on this cluster are read and checked, so that a
mistake in one environment never blocks the clusters it does not run on.
*/ -}}
{{- $envs := dict -}}
{{- range $envFile, $_ := .Files.Glob "envs/*/env.yaml" -}}
{{- $env := base (dir $envFile) -}}
{{- $def := include "layout.parse" (merge (dict "path" $envFile) $io) | fromJson -}}
{{- $clusters := $def.clusters | default (dict) -}}
{{- $instances := $def.instances | default (dict) -}}
{{- if hasKey $clusters $cluster -}}
{{- include "layout.checkLabel" (dict "name" $env "what" "environment" "context" $envFile) -}}
{{- range $c, $placement := $clusters -}}
{{- include "layout.checkLabel" (dict "name" $c "what" "cluster" "context" $envFile) -}}
{{- range $d := ($placement | default (dict)).disabled | default (list) -}}
{{- if not (hasKey $instances $d) -}}
{{- fail (printf "%s: instance %q disabled on %s is not declared (SPEC §10.2)" $envFile $d $c) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $i, $decl := $instances -}}
{{- include "layout.checkLabel" (dict "name" $i "what" "instance" "context" $envFile) -}}
{{- if and ($decl | default (dict)).local ($decl | default (dict)).app -}}
{{- fail (printf "%s: instance %q has both app and local (SPEC §10.3)" $envFile $i) -}}
{{- end -}}
{{- end -}}
{{- $_ := set $envs $env (dict "clusters" $clusters "instances" $instances) -}}
{{- end -}}
{{- end -}}

{{- /* Orphans under envs/ and clusters/ (SPEC §3.5, §5.3, §5.5). */ -}}
{{- range $file, $_ := .Files.Glob "envs/**" -}}
{{- $parts := splitList "/" $file -}}
{{- $env := index $parts 1 -}}
{{- if hasKey $envs $env -}}
{{- $e := index $envs $env -}}
{{- $rest := slice $parts 2 -}}
{{- $orphan := false -}}
{{- if eq (len $rest) 1 -}}
{{- $orphan = not (has (first $rest) (list "env.yaml" "properties.yaml")) -}}
{{- else if eq (len $rest) 2 -}}
{{- $orphan = true -}}
{{- else if eq (first $rest) "instances" -}}
{{- $orphan = not (hasKey $e.instances (index $rest 1)) -}}
{{- else if eq (first $rest) "clusters" -}}
{{- $c := index $rest 1 -}}
{{- if not (hasKey $e.clusters $c) -}}
{{- $orphan = true -}}
{{- else if eq (len $rest) 3 -}}
{{- $orphan = ne (index $rest 2) "properties.yaml" -}}
{{- else if eq (len $rest) 4 -}}
{{- $orphan = true -}}
{{- else if ne (index $rest 2) "instances" -}}
{{- $orphan = true -}}
{{- else -}}
{{- $i := index $rest 3 -}}
{{- $orphan = or (not (hasKey $e.instances $i)) (has $i ((index $e.clusters $c | default (dict)).disabled | default (list))) -}}
{{- end -}}
{{- else -}}
{{- $orphan = true -}}
{{- end -}}
{{- if $orphan -}}
{{- fail (printf "%s: matches no declared environment, cluster or instance (SPEC §3.5)" $file) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $env, $e := $envs -}}
{{- range $instance, $_ := $e.instances -}}
{{- include "layout.checkAppDirectory" (merge (dict "layer" (printf "envs/%s/instances/%s" $env $instance)) $io) -}}
{{- end -}}
{{- end -}}
{{- range $file, $_ := .Files.Glob (printf "clusters/%s/**" $cluster) -}}
{{- $parts := splitList "/" $file -}}
{{- $c := index $parts 1 -}}
{{- include "layout.checkLabel" (dict "name" $c "what" "cluster" "context" $file) -}}
{{- $rest := slice $parts 2 -}}
{{- if gt (len $rest) 1 -}}
{{- include "layout.checkLabel" (dict "name" (index $rest 1) "what" "app" "context" $file) -}}
{{- end -}}
{{- if eq (len $rest) 1 -}}
{{- if ne (first $rest) "properties.yaml" -}}
{{- fail (printf "%s: matches nothing the layout defines (SPEC §3.5)" $file) -}}
{{- end -}}
{{- else if eq (len $rest) 2 -}}
{{- fail (printf "%s: a file where the layout expects a directory (SPEC §3)" $file) -}}
{{- else if eq (first $rest) "apps" -}}
{{- if include "layout.exists" (merge (dict "path" (printf "catalog/apps/%s" (index $rest 1))) $io) -}}
{{- fail (printf "%s: cluster app %q has the name of a catalog app (SPEC §4.4)" $file (index $rest 1)) -}}
{{- end -}}
{{- else if eq (first $rest) "overrides" -}}
{{- $app := index $rest 1 -}}
{{- if not (include "layout.exists" (merge (dict "path" (printf "catalog/apps/%s" $app)) $io)) -}}
{{- fail (printf "%s: overrides %q, which is not a catalog app (SPEC §5.3)" $file $app) -}}
{{- end -}}
{{- else -}}
{{- fail (printf "%s: matches nothing the layout defines (SPEC §3.5)" $file) -}}
{{- end -}}
{{- end -}}

{{- /* Every app directory, used on this cluster or not (SPEC §3.5, §8). */ -}}
{{- $appDirectories := dict -}}
{{- range $file := concat (include "layout.glob" (merge (dict "path" "catalog/apps") $io) | fromJsonArray) (include "layout.glob" (merge (dict "path" (printf "clusters/%s" $cluster)) $io) | fromJsonArray) -}}
{{- $parts := splitList "/" $file -}}
{{- if hasPrefix "catalog/" $file -}}
{{- $_ := set $appDirectories (join "/" (slice $parts 0 3)) true -}}
{{- else if and (gt (len $parts) 4) (has (index $parts 2) (list "apps" "overrides")) -}}
{{- $_ := set $appDirectories (join "/" (slice $parts 0 4)) true -}}
{{- end -}}
{{- end -}}
{{- range $directory, $_ := $appDirectories -}}
{{- include "layout.checkLabel" (dict "name" (base $directory) "what" "app" "context" $directory) -}}
{{- /* A higher layer may declare the sources these values files configure:
   they are checked against the instances, once those are known. */ -}}
{{- include "layout.checkAppDirectory" (merge (dict "layer" $directory) $io) -}}
{{- end -}}

{{- /* Instances placed on this cluster. */ -}}
{{- $namespaces := dict -}}
{{- $apps := dict -}}
{{- $overrideSources := dict -}}
{{- range $env, $e := $envs }}
{{- if hasKey $e.clusters $cluster }}
{{- $disabled := (index $e.clusters $cluster | default (dict)).disabled | default (list) -}}

{{- $props := dict -}}
{{- include "layout.mergeFiles" (merge (dict "dst" $props "paths" (list
      "catalog/properties.yaml"
      (printf "envs/%s/properties.yaml" $env)
      (printf "clusters/%s/properties.yaml" $cluster)
      (printf "envs/%s/clusters/%s/properties.yaml" $env $cluster))) $io) -}}
{{- range $name, $value := $props -}}
{{- if not (regexMatch "^[a-zA-Z][a-zA-Z0-9]*$" $name) -}}
{{- fail (printf "%s on %s: property name %q must match [a-zA-Z][a-zA-Z0-9]* (SPEC §9.1)" $env $cluster $name) -}}
{{- end -}}
{{- if or (kindIs "map" $value) (kindIs "slice" $value) -}}
{{- fail (printf "%s on %s: property %q must be a scalar (SPEC §9.1)" $env $cluster $name) -}}
{{- end -}}
{{- end -}}

{{- range $instance, $decl := $e.instances }}
{{- if not (has $instance $disabled) }}
{{- $decl = $decl | default (dict) -}}
{{- $context := printf "%s/%s on %s" $env $instance $cluster -}}
{{- $envLayer := printf "envs/%s/instances/%s" $env $instance -}}
{{- $placementLayer := printf "envs/%s/clusters/%s/instances/%s" $env $cluster $instance -}}

{{- /* Resolve the app and its layers (SPEC §4, §5). */ -}}
{{- $layers := list -}}
{{- $app := "" -}}
{{- if $decl.local -}}
{{- if not (include "layout.read" (merge (dict "path" (printf "%s/app.yaml" $envLayer)) $io)) -}}
{{- fail (printf "%s: local instance without %s/app.yaml" $context $envLayer) -}}
{{- end -}}
{{- $layers = list $envLayer $placementLayer -}}
{{- else -}}
{{- $app = $decl.app | default $instance -}}
{{- include "layout.checkLabel" (dict "name" $app "what" "app" "context" $context) -}}
{{- $clusterApp := printf "clusters/%s/apps/%s" $cluster $app -}}
{{- $catalogApp := printf "catalog/apps/%s" $app -}}
{{- if include "layout.exists" (merge (dict "path" $clusterApp) $io) -}}
{{- $layers = list $clusterApp $envLayer $placementLayer -}}
{{- else if include "layout.exists" (merge (dict "path" $catalogApp) $io) -}}
{{- $layers = list $catalogApp $envLayer (printf "clusters/%s/overrides/%s" $cluster $app) $placementLayer -}}
{{- else -}}
{{- fail (printf "%s: app %q resolves neither in the catalog nor on the cluster" $context $app) -}}
{{- end -}}
{{- end -}}

{{- /* Merge app.yaml across layers (SPEC §6.2). */ -}}
{{- $spec := dict -}}
{{- $typesByLayer := dict -}}
{{- range $layer := $layers -}}
{{- include "layout.mergeFiles" (merge (dict "dst" $spec "paths" (list (printf "%s/app.yaml" $layer))) $io) -}}
{{- $types := dict -}}
{{- range $name, $source := $spec.sources | default (dict) -}}
{{- $_ := set $types $name (toString ($source | default (dict)).type) -}}
{{- end -}}
{{- $_ := set $typesByLayer $layer $types -}}
{{- end -}}
{{- /* A source is declared by any layer of the instance, on any of its clusters (SPEC §3.4). */ -}}
{{- $declarations := $layers -}}
{{- range $c, $_ := $e.clusters -}}
{{- $declarations = concat $declarations (list (printf "clusters/%s/apps/%s" $c $app) (printf "clusters/%s/overrides/%s" $c $app) (printf "envs/%s/clusters/%s/instances/%s" $env $c $instance)) -}}
{{- end -}}
{{- $declaredSources := list -}}
{{- range $layer := $declarations -}}
{{- $content := include "layout.parse" (merge (dict "path" (printf "%s/app.yaml" $layer)) $io) | fromJson -}}
{{- range $name, $_ := $content.sources | default (dict) -}}
{{- include "layout.checkLabel" (dict "name" $name "what" "source" "context" (printf "%s/app.yaml" $layer)) -}}
{{- $declaredSources = append $declaredSources $name -}}
{{- end -}}
{{- end -}}
{{- $sources := $spec.sources | default (dict) -}}

{{- /* Check the files of every layer (SPEC §3.5, §7.1). */ -}}
{{- $manifestLayers := list -}}
{{- range $layer := $layers -}}
{{- $hasManifests := include "layout.read" (merge (dict "path" (printf "%s/manifests/kustomization.yaml" $layer)) $io) -}}
{{- if $hasManifests -}}
{{- $manifestLayers = append $manifestLayers $layer -}}
{{- end -}}
{{- range $file := include "layout.glob" (merge (dict "path" $layer) $io) | fromJsonArray -}}
{{- $rel := trimPrefix (printf "%s/" $layer) $file -}}
{{- if regexMatch "^values/[^/]+\\.yaml$" $rel -}}
{{- $source := trimSuffix ".yaml" (trimPrefix "values/" $rel) -}}
{{- if or (hasPrefix "clusters/" $layer) (hasPrefix "catalog/" $layer) -}}
{{- /* A default or cluster layer serves every instance of the app on the
   cluster: its values files are checked against all of them, once they are
   known. */ -}}
{{- $_ := set $overrideSources $layer (concat (index $overrideSources $layer | default (list)) $declaredSources) -}}
{{- else if not (has $source $declaredSources) -}}
{{- fail (printf "%s: no layer of %s declares a source %q (SPEC §3.5)" $file $context $source) -}}
{{- end -}}
{{- $types := index $typesByLayer $layer -}}
{{- if and (hasKey $types $source) (ne (index $types $source) "helm") -}}
{{- fail (printf "%s: source %q of %s is not a helm source in this layer (SPEC §7.1)" $file $source $context) -}}
{{- end -}}
{{- else if hasPrefix "manifests/" $rel -}}
{{- if not $hasManifests -}}
{{- fail (printf "%s: %s/manifests/ has no kustomization.yaml (SPEC §8.1)" $file $layer) -}}
{{- end -}}
{{- else if ne $rel "app.yaml" -}}
{{- fail (printf "%s: matches nothing the layout defines (SPEC §3.5)" $file) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* Stack the manifest layers (SPEC §8.4, §8.5). */ -}}
{{- $present := dict -}}
{{- range $layer := $manifestLayers -}}
{{- $m := include "layout.manifests" (merge (dict "layer" $layer) $io) | fromJson -}}
{{- range $resource := $m.resources -}}
{{- if hasKey $present $resource.identity -}}
{{- fail (printf "%s: %s adds %s, which a lower layer already has (SPEC §8.5)" $context $layer $resource.identity) -}}
{{- end -}}
{{- /* Kustomize does not tell namespace "default" apart from none. */ -}}
{{- $twin := ternary (trimSuffix "_default" $resource.identity) (printf "%s_default" $resource.identity) (hasSuffix "_default" $resource.identity) -}}
{{- if hasKey $present $twin -}}
{{- fail (printf "%s: %s adds %s next to %s, one object to Kustomize, which treats namespace default as none (SPEC §8.3)" $context $layer $resource.identity $twin) -}}
{{- end -}}
{{- $_ := set $present $resource.identity $resource.apiVersion -}}
{{- end -}}
{{- range $patch := $m.patches -}}
{{- if not (hasKey $present $patch.identity) -}}
{{- fail (printf "%s: %s targets %s, absent from the lower layers (SPEC §8.4)" $context $patch.file $patch.identity) -}}
{{- end -}}
{{- if ne $patch.apiVersion (index $present $patch.identity) -}}
{{- fail (printf "%s: %s is written against %s, but its target is %s; Kustomize would not match them (SPEC §8.4)" $context $patch.file $patch.apiVersion (index $present $patch.identity)) -}}
{{- end -}}
{{- if $patch.delete -}}
{{- $_ := unset $present $patch.identity -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $namespace := $spec.namespace | default (printf "%s-%s" $env $instance) -}}
{{- $deployed := list -}}
{{- range $identity, $_ := $present -}}
{{- if contains "_" $identity -}}
{{- $deployed = append $deployed $identity -}}
{{- else -}}
{{- $deployed = append $deployed (printf "%s_%s" $identity $namespace) -}}
{{- end -}}
{{- end -}}
{{- $manifestMapping := ($spec.manifests | default (dict)).properties | default (dict) -}}
{{- range $identity, $_ := $manifestMapping -}}
{{- if not (hasKey $present $identity) -}}
{{- fail (printf "%s: manifests.properties targets %s, absent once every layer is applied (SPEC §9.3.2)" $context $identity) -}}
{{- end -}}
{{- end -}}
{{- if and (not $sources) (not $manifestLayers) -}}
{{- fail (printf "%s: no source and no manifests (SPEC §6.1.1)" $context) -}}
{{- end -}}

{{- /* Namespace and Helm releases, unique together on the cluster (SPEC §6, §12). */ -}}
{{- if not $spec.namespace -}}
{{- $key := printf "default namespace %s" $namespace -}}
{{- if hasKey $namespaces $key -}}
{{- fail (printf "%s and %s both default to namespace %q; set namespace in one of them, or rename one" (index $namespaces $key) $context $namespace) -}}
{{- end -}}
{{- $_ := set $namespaces $key $context -}}
{{- end -}}
{{- include "layout.checkLabel" (dict "name" (toString $namespace) "what" "namespace" "context" $context) -}}
{{- $helmSources := list -}}
{{- range $name, $source := $sources -}}
{{- if eq (toString $source.type) "helm" -}}
{{- $helmSources = append $helmSources $name -}}
{{- end -}}
{{- end -}}
{{- $releases := dict -}}
{{- range $name := $helmSources -}}
{{- $release := toString ((index $sources $name).releaseName | default (printf "%s-%s" $env $instance)) -}}
{{- if not (and (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $release) (le (len $release) 53)) -}}
{{- fail (printf "%s, source %s: Helm release name %q is not a valid release name of at most 53 characters; set releaseName, or shorten the environment or instance name" $context $name $release) -}}
{{- end -}}
{{- $key := printf "%s/%s" $namespace $release -}}
{{- if hasKey $namespaces $key -}}
{{- fail (printf "%s and %s both install Helm release %q in namespace %q; set releaseName on one of them, as an app with several Helm sources must (SPEC §6.1.5)" (index $namespaces $key) (printf "%s, source %s" $context $name) $release $namespace) -}}
{{- end -}}
{{- $_ := set $namespaces $key (printf "%s, source %s" $context $name) -}}
{{- $_ := set $releases $name $release -}}
{{- end -}}
{{- range $identity := $deployed -}}
{{- if hasKey $apps $identity -}}
{{- fail (printf "%s and %s both deploy %s (SPEC §8.7)" (index $apps $identity) $context $identity) -}}
{{- end -}}
{{- $_ := set $apps $identity $context -}}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s.%s.%s" $env $instance $cluster }}
  namespace: {{ $root.Values.argocdNamespace }}
spec:
  project: {{ $root.Values.project }}
  revisionHistoryLimit: 0
  destination:
    name: {{ $cluster }}
    namespace: {{ $namespace }}
  sources:
    {{- $refs := dict }}
    {{- range $name, $source := $sources }}
    {{- $sourceContext := printf "%s, source %s" $context $name -}}
    {{- range $field := list "type" "repoURL" "targetRevision" -}}
    {{- if not (index $source $field) -}}
    {{- fail (printf "%s: missing %s (SPEC §6.1.4)" $sourceContext $field) -}}
    {{- end -}}
    {{- end -}}
    {{- if not (kindIs "string" $source.targetRevision) -}}
    {{- fail (printf "%s: targetRevision %v is not a string; quote it so that YAML does not read it as a number (SPEC §6.1.2)" $sourceContext $source.targetRevision) -}}
    {{- end -}}
    {{- range $field, $value := $source -}}
    {{- if and (kindIs "map" $value) (not (has $field (list "repoURL" "properties"))) -}}
    {{- fail (printf "%s: %s cannot take a property, only repoURL can (SPEC §6.1.3)" $sourceContext $field) -}}
    {{- end -}}
    {{- end -}}
    {{- if and (ne (toString $source.type) "helm") (or $source.chart $source.releaseName) -}}
    {{- fail (printf "%s: chart and releaseName only apply to a helm source (SPEC §6.1.2)" $sourceContext) -}}
    {{- end -}}
    {{- if or (and $source.chart $source.path) (not (or $source.chart $source.path)) -}}
    {{- fail (printf "%s: exactly one of chart and path is required (SPEC §6.1.4)" $sourceContext) -}}
    {{- end -}}
    {{- if not (has (toString $source.type) (list "helm" "kustomize" "jsonnet" "directory")) -}}
    {{- fail (printf "%s: unknown type %q (SPEC §6.1.2)" $sourceContext $source.type) -}}
    {{- end -}}
    {{- $url := $source.repoURL -}}
    {{- if kindIs "map" $url -}}
    {{- include "layout.requireProperty" (dict "props" $props "name" $url.property "context" $sourceContext) -}}
    {{- $url = index $props $url.property -}}
    {{- end -}}
    {{- if $source.repository -}}
    {{- $url = printf "%s/%s" $url $source.repository -}}
    {{- end }}
    - repoURL: {{ $url }}
      {{- if $source.chart }}
      chart: {{ $source.chart }}
      {{- else }}
      path: {{ $source.path }}
      {{- end }}
      targetRevision: {{ $source.targetRevision | quote }}
      {{- $mapping := $source.properties | default (dict) }}
      {{- if eq $source.type "helm" }}
      helm:
        releaseName: {{ index $releases $name }}
        {{- $valueFiles := list -}}
        {{- range $layer := $layers -}}
        {{- $file := printf "%s/values/%s.yaml" $layer $name -}}
        {{- if include "layout.read" (merge (dict "path" $file) $io) -}}
        {{- $ref := include "layout.valuesRef" (merge (dict "path" $file) $io) -}}
        {{- $_ := set $refs (regexFind "^\\$[a-z]+" $ref | trimPrefix "$") true -}}
        {{- $valueFiles = append $valueFiles $ref -}}
        {{- end -}}
        {{- end }}
        {{- if $valueFiles }}
        valueFiles:
          {{- toYaml $valueFiles | nindent 10 }}
        {{- end }}
        {{- if $mapping }}
        parameters:
          {{- range $parameter, $property := $mapping }}
          {{- include "layout.requireProperty" (dict "props" $props "name" $property "context" $sourceContext) }}
          {{- $value := index $props $property }}
          - name: {{ $parameter }}
            value: {{ include "layout.scalar" $value | quote }}
            {{- if kindIs "string" $value }}
            forceString: true
            {{- end }}
          {{- end }}
        {{- end }}
      {{- else if eq $source.type "jsonnet" }}
      directory:
        jsonnet:
          {{- $jsonnet := false }}
          {{- range $kind := list "extVars" "tlas" }}
          {{- with index $mapping $kind }}
          {{- $jsonnet = true }}
          {{ $kind }}:
            {{- range $variable, $property := . }}
            {{- include "layout.requireProperty" (dict "props" $props "name" $property "context" $sourceContext) }}
            - name: {{ $variable }}
              value: {{ include "layout.scalar" (index $props $property) | quote }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- if not $jsonnet }} {}{{ end }}
      {{- else if eq $source.type "kustomize" }}
      kustomize:
        {{- if $mapping }}
        patches:
          {{- include "layout.patches" (dict "mapping" $mapping "props" $props "context" $sourceContext) | trim | nindent 10 }}
        {{- else }} {}
        {{- end }}
      {{- else }}
      {{- if $mapping }}
      {{- fail (printf "%s: a directory source takes no mapping (SPEC §9.3.1)" $sourceContext) }}
      {{- end }}
      directory: {}
      {{- end }}
    {{- end }}
    {{- if hasKey $refs "layout" }}
    - repoURL: {{ $repoURL }}
      targetRevision: {{ $revision | quote }}
      ref: layout
    {{- end }}
    {{- if hasKey $refs "catalog" }}
    - repoURL: {{ $catalog.repoURL }}
      targetRevision: {{ $catalog.revision | quote }}
      ref: catalog
    {{- end }}
    {{- if $manifestLayers }}
    - repoURL: {{ $repoURL }}
      targetRevision: {{ $revision | quote }}
      path: {{ include "layout.repoPath" (dict "root" $root "path" "base") }}
      kustomize:
        components:
          {{- range $layer := $manifestLayers }}
          - {{ include "layout.component" (merge (dict "layer" $layer) $io) }}
          {{- end }}
        {{- if $manifestMapping }}
        patches:
          {{- include "layout.patches" (dict "mapping" $manifestMapping "props" $props "context" $context) | trim | nindent 10 }}
        {{- end }}
    {{- end }}
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    {{- $application := $spec.application | default (dict) }}
    {{- range $field, $_ := $application }}
    {{- if not (has $field (list "syncOptions" "ignoreDifferences")) }}
    {{- fail (printf "%s: application.%s is not supported; use syncOptions or ignoreDifferences (SPEC §6.3)" $context $field) }}
    {{- end }}
    {{- end }}
    {{- $options := dict "CreateNamespace" "true" }}
    {{- if $application.ignoreDifferences }}
    {{- $_ := set $options "RespectIgnoreDifferences" "true" }}
    {{- end }}
    {{- range $option := $application.syncOptions | default (list) }}
    {{- $parts := splitn "=" 2 (toString $option) }}
    {{- $_ := set $options $parts._0 ($parts._1 | default "") }}
    {{- end }}
    {{- $syncOptions := list }}
    {{- range $name, $value := $options }}
    {{- $syncOptions = append $syncOptions (printf "%s=%s" $name $value) }}
    {{- end }}
    syncOptions:
      {{- toYaml $syncOptions | nindent 6 }}
  {{- with $application.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
