namespace: external-secrets
sources:
  chart:
    type: helm
    repoURL:
      property: ghcrCharts
    repository: external-secrets/charts
    chart: external-secrets
    targetRevision: "2.11.0"
    releaseName: external-secrets
manifests:
  properties:
    external-secrets.io/ClusterSecretStore/vault:
      /spec/provider/vault/server: vaultURL
application:
  syncOptions:
    # Its ClusterSecretStore CRD exceeds the 256 KiB annotation a client-side
    # apply stores.
    - ServerSideApply=true
  ignoreDifferences:
    # The chart's cert-controller injects the CA bundles after the sync.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
